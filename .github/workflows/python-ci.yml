# Python CI: lint (new Snowflake-related code only) + the pytest suite.
# The test job downloads the Olist CSVs from Kaggle (secret: KAGGLE_API_TOKEN, or KAGGLE_USERNAME + KAGGLE_KEY),
# builds warehouse.duckdb and the Power BI export, and then runs every test, the `warehouse`-marked ones included.
# Without Kaggle credentials and without a cached copy, the `warehouse` tests are skipped (conftest.py) and the rest
# still run. No Snowflake connection; missing Snowflake credentials can never fail this workflow.
# See docs/migration/CI_SETUP.md.
name: python-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"   # pyproject requires >=3.13; overrides the root .python-version (3.14)

jobs:
  lint:
    name: ruff (new code only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      # Pinned ruff + explicit rule selection so a ruff upgrade cannot change what is checked.
      # Scope is limited to the code added for the Snowflake implementation; legacy DuckDB code is not linted here.
      - name: ruff check
        run: >
          uvx ruff@0.12.0 check --select E4,E7,E9,F
          src/data_access
          src/reconciliation
          snowflake/ingestion
          tests/test_data_access.py
          tests/test_reconciliation.py
          tests/test_snowflake_ingestion.py
          tests/test_powerbi_snowflake.py
          powerbi/snowflake

  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      # --locked fails (it never rewrites uv.lock) if uv.lock is out of date with pyproject.toml.
      # That is intentional: regenerate the lock with `uv lock` and commit it, rather than letting CI drift.
      - name: Install dependencies (locked, with dev group)
        run: uv sync --locked --group dev

      # The warehouse-backed tests (DuckDB build, analytics, Power BI project and export) need the real Olist CSVs:
      # the build's validation checks figures from the real data (e.g. 7,827 late deliveries), so a sample would fail.
      # The CSVs come from Kaggle and are cached; bump the key suffix to force a fresh download.
      - name: Restore Olist raw data (cache)
        id: olist-cache
        uses: actions/cache@v4
        with:
          path: data
          key: olist-brazilian-ecommerce-v1

      # Secrets go through env, never into the script. Either a KAGGLE_API_TOKEN (new-style token) or the legacy
      # KAGGLE_USERNAME + KAGGLE_KEY pair works. Without them (e.g. a PR from a fork) and without a cache hit,
      # nothing is downloaded and the warehouse tests are skipped with a notice.
      - name: Download Olist raw data from Kaggle
        if: steps.olist-cache.outputs.cache-hit != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -eu
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ] || unset KAGGLE_USERNAME KAGGLE_KEY
          if [ -z "${KAGGLE_API_TOKEN:-}" ] && [ -z "${KAGGLE_USERNAME:-}" ]; then
            echo "::notice::No Kaggle credentials (KAGGLE_API_TOKEN, or KAGGLE_USERNAME + KAGGLE_KEY); warehouse tests will be skipped."
            exit 0
          fi
          # kaggle 2.2.5 imports six without declaring it, hence --with six.
          uvx --with six==1.17.0 kaggle@2.2.5 datasets download -d olistbr/brazilian-ecommerce -p data --unzip -q

      - name: Build the DuckDB warehouse and the Power BI export
        id: warehouse
        run: |
          set -eu
          if [ ! -f data/olist_orders_dataset.csv ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha256sum data/*.csv
          uv run --no-sync python src/transformation/build_warehouse.py
          uv run --no-sync python src/powerbi/export_data.py
          echo "built=true" >> "$GITHUB_OUTPUT"

      # REQUIRE_WAREHOUSE=1 turns "warehouse missing" into a failure, so a built run can never skip those tests quietly.
      - name: pytest
        env:
          REQUIRE_WAREHOUSE: ${{ steps.warehouse.outputs.built == 'true' && '1' || '0' }}
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider
