version: 2

# Staging layer: one typed view per RAW table. Same column names and logical types as the DuckDB
# sql/staging/stg_*.sql views. No cleaning, no joins, no business logic.
# Descriptions here feed the generated data dictionary.

models:
  - name: stg_olist__customers
    description: >
      Typed view over RAW.CUSTOMERS. Grain: one row per customer_id, which is per ORDER (99,441 ids for
      about 96,096 real people); customer_unique_id identifies the person. Zip prefixes stay text so leading
      zeros survive.
    columns:
      - name: customer_id
        description: "Per-order customer id (source key joined to orders.customer_id)."
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Identifier of the real customer; one person can own many customer_id values."
        data_tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "First five digits of the customer zip code, as text to preserve leading zeros."
      - name: customer_city
        description: "Customer city as written in the source (lower case, may contain accents)."
      - name: customer_state
        description: "Two-letter Brazilian state code of the customer."

  - name: stg_olist__geolocation
    description: >
      Typed view over RAW.GEOLOCATION. NOT unique: about 1M latitude/longitude points for about 19k zip
      prefixes; collapsed to one row per prefix in int_geography_rollup.
    columns:
      - name: geolocation_zip_code_prefix
        description: "Zip-code prefix of the point, as text to preserve leading zeros."
      - name: geolocation_lat
        description: "Latitude in decimal degrees (FLOAT / DuckDB DOUBLE). A few points lie outside Brazil."
      - name: geolocation_lng
        description: "Longitude in decimal degrees (FLOAT / DuckDB DOUBLE)."
      - name: geolocation_city
        description: "City name attached to the point in the source."
      - name: geolocation_state
        description: "Two-letter state code attached to the point in the source."

  - name: stg_olist__order_items
    description: >
      Typed view over RAW.ORDER_ITEMS. Grain: one row per order item (order_id, order_item_id).
      Money is NUMBER(12,2) so sums are exact.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        description: "Order the item belongs to."
        data_tests:
          - not_null
      - name: order_item_id
        description: "Position of the item within the order (1-based, up to 21)."
        data_tests:
          - not_null
      - name: product_id
        description: "Product sold (joins to products.product_id)."
      - name: seller_id
        description: "Seller who fulfils the item (joins to sellers.seller_id)."
      - name: shipping_limit_date
        description: "Deadline for the seller to hand the item to the carrier (TIMESTAMP_NTZ)."
      - name: price
        description: "Item price in BRL, NUMBER(12,2)."
        data_tests:
          - not_null
      - name: freight_value
        description: "Freight charged for the item in BRL, NUMBER(12,2)."
        data_tests:
          - not_null

  - name: stg_olist__order_payments
    description: >
      Typed view over RAW.ORDER_PAYMENTS. Grain: one row per payment record (order_id, payment_sequential).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        description: "Order paid by this record."
        data_tests:
          - not_null
      - name: payment_sequential
        description: "Sequence number of the payment within the order (1-based, up to 29)."
        data_tests:
          - not_null
      - name: payment_type
        description: "Payment method: credit_card, boleto, voucher, debit_card or not_defined."
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_installments
        description: "Number of instalments chosen by the customer."
      - name: payment_value
        description: "Amount of this payment record in BRL, NUMBER(12,2)."
        data_tests:
          - not_null

  - name: stg_olist__order_reviews
    description: >
      Typed view over RAW.ORDER_REVIEWS. Grain: one row per (review_id, order_id). review_id alone is NOT
      unique: 789 review ids appear on more than one order, and 547 orders have 2-3 reviews.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
    columns:
      - name: review_id
        description: "Review identifier (shared by several orders in a few cases)."
        data_tests:
          - not_null
      - name: order_id
        description: "Order being reviewed."
        data_tests:
          - not_null
      - name: review_score
        description: "Satisfaction score from 1 (worst) to 5 (best)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_comment_title
        description: "Optional comment title; NULL when the customer wrote none (empty fields are read as NULL)."
      - name: review_comment_message
        description: "Optional comment text; NULL for about 58.7% of reviews. Not trimmed."
      - name: review_creation_date
        description: "When the satisfaction survey was sent (TIMESTAMP_NTZ)."
      - name: review_answer_timestamp
        description: "When the customer answered the survey (TIMESTAMP_NTZ)."

  - name: stg_olist__orders
    description: >
      Typed view over RAW.ORDERS. Grain: one row per order (order_id). No cleaning, no re-casing.
    columns:
      - name: order_id
        description: "Order identifier."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Per-order customer id (joins to customers.customer_id)."
        data_tests:
          - not_null
      - name: order_status
        description: "Order lifecycle status (8 values)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [approved, canceled, created, delivered, invoiced, processing, shipped, unavailable]
      - name: order_purchase_timestamp
        description: "When the customer placed the order (TIMESTAMP_NTZ)."
        data_tests:
          - not_null
      - name: order_approved_at
        description: "When payment was approved; NULL if never approved."
      - name: order_delivered_carrier_date
        description: "When the order was handed to the carrier; NULL if not yet."
      - name: order_delivered_customer_date
        description: "When the customer received the order; NULL if not delivered."
      - name: order_estimated_delivery_date
        description: "Delivery date promised to the customer at purchase."

  - name: stg_olist__products
    description: >
      Typed view over RAW.PRODUCTS. Grain: one row per product (product_id). The source misspellings
      product_name_lenght / product_description_lenght are renamed to *_length, as in the DuckDB view.
    columns:
      - name: product_id
        description: "Product identifier."
        data_tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Portuguese category name; NULL for 610 products."
      - name: product_name_length
        description: "Number of characters in the product name."
      - name: product_description_length
        description: "Number of characters in the product description."
      - name: product_photos_qty
        description: "Number of product photos."
      - name: product_weight_g
        description: "Product weight in grams."
      - name: product_length_cm
        description: "Packaged length in centimetres."
      - name: product_height_cm
        description: "Packaged height in centimetres."
      - name: product_width_cm
        description: "Packaged width in centimetres."

  - name: stg_olist__sellers
    description: "Typed view over RAW.SELLERS. Grain: one row per seller (seller_id)."
    columns:
      - name: seller_id
        description: "Seller identifier."
        data_tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: "First five digits of the seller zip code, as text to preserve leading zeros."
      - name: seller_city
        description: "Seller city as written in the source."
      - name: seller_state
        description: "Two-letter Brazilian state code of the seller."

  - name: stg_olist__category_translation
    description: >
      Typed view over RAW.PRODUCT_CATEGORY_TRANSLATION. Grain: one row per Portuguese category name.
      Two categories used by products are missing here (pc_gamer, portateis_cozinha_e_preparadores_de_alimentos).
    columns:
      - name: product_category_name
        description: "Portuguese category name."
        data_tests:
          - unique
          - not_null
      - name: product_category_name_english
        description: "English category name."
        data_tests:
          - not_null
